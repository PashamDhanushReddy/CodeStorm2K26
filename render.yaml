services:
  - type: web
    name: cs-admin-dashboard
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn cs_admin.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
    buildFilter:
      paths:
        - requirements.txt
        - build.sh
        - cs_admin/**