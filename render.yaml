databases:
  - name: codestorm_db
    databaseName: codestorm_db
    user: codestorm_user
services:
  - type: web
    name: codestorm2026
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn codestorm_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: codestorm_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
